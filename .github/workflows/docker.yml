name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - '*.gif'
      - '*.png'
      - '*.jpg'
      - 'LICENSE'
      - '.gitignore'
  # Manual rebuild of any ref (e.g. to restore :latest from main)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-knob-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Build porto-watchdog (ARM static)
        run: arm-linux-gnueabihf-gcc -static -o porto-watchdog knob_reader.c

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: porto-watchdog-arm
          path: porto-watchdog

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: porto-watchdog

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # :latest is reserved for main and release tags. Feature branches publish
      # under their own branch name (e.g. :apn) so they can be test-deployed
      # without ever moving :latest - production only pulls code that reached main.
      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=rsmcx1/porto-watchdog:latest,rsmcx1/porto-watchdog:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=rsmcx1/porto-watchdog:${{ github.ref_name }},rsmcx1/porto-watchdog:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
