services:
  # -------------------------------------------------------------------------
  # Porto Watchdog - remote watchdog for channel switching & alerts
  # All config via environment variables - no config files needed
  # -------------------------------------------------------------------------
  porto-watchdog:
    image: rsmcx1/porto-watchdog:latest
    container_name: porto-watchdog
    ports:
      - "4378:4378/udp"
    environment:
      # -- Mumble server --
      MUMBLE_HOST: zip-mumble-server
      MUMBLE_PORT: "64738"
      BOT_USERNAME: ChannelBot
      MUMBLE_SERVER_PASSWORD: ""

      # -- Security --
      # Generate with: docker run --rm rsmcx1/porto-watchdog --gen-secret
      # Option A: shared secret (all radios use this key)
      SECRET: "CHANGE_ME_GENERATE_A_REAL_SECRET"
      # Option B: per-radio secrets (overrides SECRET for listed radios)
      # Allows revoking a compromised radio without re-keying others
      # SECRETS: "radio01=secretA,radio02=secretB"
      # Optional: restrict source IPs (comma-separated, empty = any)
      ALLOWED_IPS: ""

      # -- UDP listener --
      UDP_PORT: "4378"
      UDP_ADDR: "0.0.0.0"

      # -- Channel navigation --
      CHANNELS_SORT_BY: id
      CHANNELS_SKIP_ROOT: "true"
      CHANNELS_WRAP_AROUND: "true"
      # Skip specific channels (comma-separated names, case-sensitive)
      # CHANNELS_SKIP: "Lobby,AFK,Admin"

      # -- TTS announcements --
      ANNOUNCE_ENABLED: "true"
      ANNOUNCE_FORMAT: "{channel}"

      # -- Emergency & Ident --
      EMERGENCY_FORMAT: "alert alert"
      IDENT_FORMAT: "{username}"

      # -- Connect message (sent to radio user when they join the server) --
      CONNECT_MESSAGE_ENABLED: "true"
      CONNECT_MESSAGE_FORMAT: "{username} {channel} connected"

      # -- GPS -> TAK forwarding (optional, disabled unless TAK_HOST set) --
      # Radios with GPS enabled (see README) report positions which are
      # forwarded to a TAK server as Cursor-on-Target events.
      # Recommended: certificate auth against TAK's stock TLS input (8089).
      # TAK_HOST: takserver              # TAK server hostname/IP
      # TAK_PORT: "8089"                 # 8089 = stock TLS input
      # TAK_TLS: "true"                  # client-certificate auth (see README)
      # TAK_CA_FILE: "/app/takcerts/ca.pem"
      # TAK_CERT_FILE: "/app/takcerts/porto-bot.pem"
      # TAK_KEY_FILE: "/app/takcerts/porto-bot.key"
      # TAK_KEY_PASS: "atakatak"         # makeCert.sh default key password
      # (plain alternative: STCP input on 8087, TAK_TLS "false" - LAN only)
      # TAK_COT_TYPE: "a-f-G-U-C"        # CoT event type
      # TAK_STALE: "300"                 # seconds until a marker goes stale
      # TAK_TEAM: "Cyan"                 # ATAK team color
      # TAK_ROLE: "Team Member"          # ATAK role
      # TAK_CALLSIGNS: "radio01=Dad"     # per-radio callsign override

      # -- Logging --
      LOG_LEVEL: INFO

      # -- Radio mapping --
      # Format: radio_id=mumla_username (comma-separated, wildcards supported)
      # Examples: "radio01=TE300K" or "radio01=P*" (matches any user starting with P)
      RADIOS: "radio01=TE300K"
    volumes:
      # Persist bot certificate so it keeps the same identity across restarts
      # (required for Mumble ACL/registration)
      - porto-certs:/app/certs
      # TAK client certificate for TLS auth (see GPS section in README)
      # - ./takcerts:/app/takcerts:ro
    restart: unless-stopped

volumes:
  porto-certs:
